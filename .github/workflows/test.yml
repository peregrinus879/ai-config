name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  HISTFILE: /dev/null

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
      options: --init
    steps:
      - name: Prepare Arch userspace
        run: |
          pacman -Syu --noconfirm --needed git make stow jq python python-yaml nodejs shellcheck util-linux diffutils
          useradd --create-home --user-group --uid 1000 --shell /bin/bash ci
          install -d -o ci -g ci -m 700 /tmp/eyr-ci
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run unprivileged checks
        run: |
          chown --recursive --no-dereference ci:ci "$GITHUB_WORKSPACE"
          runuser -u ci -- env HOME=/home/ci TMPDIR=/tmp/eyr-ci TMUX_TMPDIR=/tmp/eyr-ci \
            bash -euo pipefail <<'CHECK_REPO'
          test "$(id -u)" -ne 0
          make lint check
          CHECK_REPO
