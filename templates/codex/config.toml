# No model pin: Codex uses its catalog default, the first picker-visible model,
# so a new generation arrives with the catalog. No service tier either: the
# Fast tier multiplies usage, so it is a per-session /fast choice, which
# features.fast_mode keeps available, never a default.
model_reasoning_effort = "xhigh"
model_reasoning_summary = "auto"
personality = "none"
web_search = "live"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "trusted-workspace"

[auto_review]
policy = """
Approve only actions necessary for H's requested work. For request_permissions, approve turn-scoped filesystem reads needed to discover, inspect, search, or locally convert non-secret files or directories that H names or directs the agent to use; ordinary personal information and document formats are not credentials. Reject session-scoped grants, external writes, all other writes outside the workspace, secret or credential access, privileged actions, destructive state changes, uploads, remote mutations, and bypasses of safety checks. A local Git commit is eligible only after H explicitly approves the exact candidate in the conversation.
"""

[features]
fast_mode = true
hooks = true
js_repl = false
request_permissions_tool = true

# The commit gate: every `git commit` must match the candidate commit-candidate
# recorded. Hooks run outside the sandbox; project-local hooks load only in
# trusted projects.
[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = "~/.agents/hooks/commit-gate"
timeout = 30

[agents]
default_subagent_reasoning_effort = "xhigh"

[permissions.trusted-workspace]
description = "Writable workspace with runtime-minimal reads, managed configuration reads, sensitive paths, and command network denied."
extends = ":workspace"

[permissions.trusted-workspace.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
"~/.claude/CLAUDE.md" = "read"
"~/.claude/settings.json" = "read"
"~/.claude/statusline.sh" = "read"
"~/.claude/skills/commit" = "read"
"~/.claude/skills/publish" = "read"
"~/.claude/skills/spar" = "read"
"~/.codex/AGENTS.md" = "read"
"~/.agents/shared-guidance.md" = "read"
"~/.agents/skills" = "read"
"~/.config/opencode" = "read"
"~/.local/bin" = "read"
"~/.local/share/mise" = "read"
"~/Projects" = "read"
# System trees, as literal paths: a glob outside the workspace can stall the
# sandbox (see the ledger). /var/log, /proc beyond :minimal, /run, /mnt, and
# /media stay closed.
"/usr" = "read"
"/etc" = "read"
"/opt" = "read"
"/sys" = "read"
"/var/lib/pacman" = "read"
# Temp roots: /tmp comes from :slash_tmp above; the other tools' session roots
# are denied by literal path (the Claude Code root carries the uid), and no
# shape deny can live under a temp root: the sandbox's glob scan dies on the
# root-owned entries there (see the ledger).
"/var/tmp" = "read"
"/tmp/opencode" = "deny"
"/tmp/claude-1000" = "deny"
# Shapes whose home-wide globs stall the sandbox (see the ledger) are denied under
# ~/Projects only; .npmrc cannot be, because that glob matches inside node_modules
# trees and stalls startup too, so a project .npmrc stays readable (ledger, 2026-09-04).
"~/Projects/**/.netrc" = "deny"
"~/Projects/**/.aws" = "deny"
"~/Projects/**/.gnupg" = "deny"
"~/Projects/**/.kube" = "deny"
"~/Projects/**/.ssh" = "deny"
"~/Projects/**/.config/BraveSoftware" = "deny"
"~/Projects/**/.config/chromium" = "deny"
"~/Projects/**/.local/share/keyrings" = "deny"
"~/Projects/**/.mozilla" = "deny"
"~/Projects/**/.claude/.credentials.json" = "deny"
"~/Projects/**/.codex/auth.json" = "deny"
"~/Projects/**/.hermes/config.yaml" = "deny"
"~/Projects/**/.config/gh/hosts.yml" = "deny"
"~/Projects/**/.docker/config.json" = "deny"
"~/Projects/**/.local/share/opencode/auth.json" = "deny"
"~/Projects/**/.bash_history" = "deny"
"~/Projects/**/.zsh_history" = "deny"
"~/Projects/**/.pypirc" = "deny"
"~/Projects/**/id_dsa" = "deny"
"~/Projects/**/id_ecdsa" = "deny"
"~/Projects/**/id_ed25519" = "deny"
"~/Projects/**/id_rsa" = "deny"
"~/.aws" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.config/gh/hosts.yml" = "deny"
"~/.codex/auth.json" = "deny"
"~/.hermes/config.yaml" = "deny"
"~/.docker/config.json" = "deny"
"~/.gnupg" = "deny"
"~/.kube" = "deny"
"~/.local/share/opencode/auth.json" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/.ssh" = "deny"
"~/.bash_history" = "deny"
"~/.zsh_history" = "deny"
"~/.config/BraveSoftware" = "deny"
"~/.config/chromium" = "deny"
"~/.local/share/keyrings" = "deny"
"~/.mozilla" = "deny"
"~/**/.env" = "deny"
"~/**/.env.*" = "deny"
"~/**/auth.json" = "deny"
"~/**/secrets" = "deny"
"~/**/secrets/**" = "deny"
"~/**/*.key" = "deny"
"~/**/*.pem" = "deny"
"~/**/*.p12" = "deny"
"~/**/*.pfx" = "deny"
"~/**/credentials" = "deny"
"~/**/credentials.*" = "deny"
glob_scan_max_depth = 64

# Literal entries such as ".env" make the sandbox create empty placeholder
# files in every workspace where the path is absent; the **/ globs mask only
# paths that exist.
[permissions.trusted-workspace.filesystem.":workspace_roots"]
"." = "write"
".git/config" = "read"
".git/hooks" = "read"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/.netrc" = "deny"
"**/.npmrc" = "deny"
"**/.pypirc" = "deny"
"**/secrets" = "deny"
"**/*.key" = "deny"
"**/*.pem" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/auth.json" = "deny"
"**/.hermes/config.yaml" = "deny"
"**/credentials" = "deny"
"**/credentials.*" = "deny"
"**/id_rsa" = "deny"
"**/id_dsa" = "deny"
"**/id_ecdsa" = "deny"
"**/id_ed25519" = "deny"

[permissions.trusted-workspace.network]
enabled = false
